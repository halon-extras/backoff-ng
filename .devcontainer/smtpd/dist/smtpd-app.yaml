      $message["recipientaddress"]["domain"]          = "domain1.com";

      $result = backoff_enable($arguments, $message);
      unset($result[0]["backoff"]["properties"]["backoff-ts"]);

      if (json_encode($result) !== json_encode($expect))
          throw Exception("Test 4: FAILED\nRESULT($result)\nEXPECT($expect)");
      echo "Test 4:\tOK";

      // Test 5 (Partial override of default settings)
      $expect = [
          ["type"=>"policy",
          "fields"=>["localip"],
          "condition"=>["localip"=>"127.0.0.1"],
          "backoff"=>[
              "rate"=>[1,20],
              "tag"=>"backoff-graylisting",
              "properties"=>[
                  "backoff-graylisting-rate"=>"1/20",
                  "backoff-rate"=>"1/60",
                  "backoff-concurrency"=>"1",
                  "backoff-connectinterval"=>"10",
                  "backoff-suspend"=>"1200",
                  "backoff-ttl"=>"3600",
                  "backoff-transactionid"=>"7b3ecee9-efaa-42ab-ac44-72834dd9b5f5",
                  "backoff-diagnosticcode"=>"451 4.7.1 <bla.candy@fish.sk>: Recipient address rejected: Greylisting in effect, please come back later"
              ]
          ],
          "ttl"=>3600
      ]];

      $arguments["grouping"]                          = "&grouping1";
      $arguments["attempt"]["connection"]["localip"]  = "127.0.0.1";
      $arguments["attempt"]["connection"]["remoteip"] = "127.0.0.1";
      $arguments["attempt"]["connection"]["remotemx"] = "mx1.domain1.com";
