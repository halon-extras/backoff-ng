      $arguments["policy"]["policies"][0]             = ["fields" => ["localip"], "properties" => ["backoff-graylisting-rate" => "1/60", "backoff-graylisting-concurrency" => "1", "backoff-graylisting-connectinterval" => "10", "backoff-graylisting-suspend" => "1200", "backoff-graylisting-ttl" => "3600"]];
      $message["id"]["transaction"]                   = "7b3ecee9-efaa-42ab-ac44-72834dd9b5f5";
      $message["transportid"]                         = "transport1";
      $message["tenantid"]                            = "tenant1";
      $message["jobid"]                               = "jobid1";
      $message["recipientaddress"]["domain"]          = "domain1.com";

