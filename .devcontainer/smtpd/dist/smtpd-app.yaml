      $arguments["policy"]["policies"][0]             = ["fields" => ["localip"], "properties" => ["backoff-graylisting-rate" => "1/20", "backoff-rate" => "1/60", "backoff-concurrency" => "1", "backoff-connectinterval" => "10", "backoff-suspend" => "1200", "backoff-ttl" => "3600"]];
      $message["id"]["transaction"]                   = "7b3ecee9-efaa-42ab-ac44-72834dd9b5f5";
      $message["transportid"]                         = "transport1";
